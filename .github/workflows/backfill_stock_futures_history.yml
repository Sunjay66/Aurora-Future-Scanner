name: Aurora Historical Stock Futures Backfill

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "First historical archive date (YYYY-MM-DD)"
        required: true
        default: "2026-10-28"
      end_date:
        description: "Last historical archive date (YYYY-MM-DD)"
        required: true
        default: "2026-11-09"

permissions:
  contents: write

jobs:
  backfill-stock-futures:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout homepage-redesign
        uses: actions/checkout@v4
        with:
          ref: homepage-redesign

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download historical UDiFF archives and build stock-futures history
        run: |
          python -B scripts/backfill_stock_futures_history.py \
            --start-date "${{ inputs.start_date }}" \
            --end-date "${{ inputs.end_date }}"

      - name: Commit historical stock-futures dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stock_futures_history.csv
          git diff --cached --quiet || git commit -m "Backfill historical front-month stock futures data"
          git push
