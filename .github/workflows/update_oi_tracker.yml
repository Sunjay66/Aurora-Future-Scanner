name: Aurora Futures OI Tracker

on:
  workflow_dispatch:
  schedule:
    # 7:15 PM IST (13:45 UTC), Monday to Friday.
    - cron: "45 13 * * 1-5"

permissions:
  contents: write

jobs:
  update-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update futures OI tracker
        run: python scripts/update_oi_tracker.py

      - name: Rebuild OI classification history
        run: python scripts/classify_futures_oi.py

      - name: Download cash-market OHLC history for ADR-14
        run: python scripts/update_cash_market_history.py

      - name: Update mapped sector index history
        run: python scripts/update_sector_index_history.py

      - name: Generate current-month report and archive
        run: python scripts/generate_stock_reports.py

      - name: Commit updated tracker and report data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update futures tracker and monthly stock reports"
          git push
