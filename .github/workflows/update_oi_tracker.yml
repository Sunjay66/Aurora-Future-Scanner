name: Aurora Futures OI Tracker

on:
  workflow_dispatch:
    inputs:
      run_historical_backfill:
        description: "Run the separate historical stock-futures archive backfill"
        type: boolean
        required: true
        default: false
      backfill_start_date:
        description: "Historical backfill start date (YYYY-MM-DD)"
        type: string
        required: true
        default: "2026-10-28"
      backfill_end_date:
        description: "Historical backfill end date (YYYY-MM-DD)"
        type: string
        required: true
        default: "2026-11-09"
  schedule:
    - cron: "30 13 * * 1-5"

permissions:
  contents: write

jobs:
  update-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: homepage-redesign

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Backfill historical stock-futures archives (opt-in manual run only)
        if: github.event_name == 'workflow_dispatch' && inputs.run_historical_backfill == true
        run: |
          python -B scripts/backfill_stock_futures_history.py \
            --start-date "${{ inputs.backfill_start_date }}" \
            --end-date "${{ inputs.backfill_end_date }}"

      - name: Build stock activity history (historical backfill runs only)
        if: github.event_name == 'workflow_dispatch' && inputs.run_historical_backfill == true
        run: |
          python -B scripts/build_stock_activity_history.py

      - name: Diagnose 9 November NSE institutional reports (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          python -B scripts/diagnose_institutional_reports.py --date "2026-11-09"

      - name: Download latest NSE institutional derivatives reports
        continue-on-error: true
        run: |
          python -B scripts/update_institutional_derivatives.py

      - name: Download combined NSE, BSE and MSEI cash-market report
        continue-on-error: true
        run: |
          python -B scripts/update_cash_market.py

      - name: Run Aurora OI Tracker
        run: |
          python -B scripts/update_oi_tracker.py

      - name: Run OI Classification
        run: |
          python -B scripts/classify_futures_oi.py

      - name: Update NSE delivery history
        run: |
          python -B scripts/update_delivery_history.py

      - name: Commit updated tracker and institutional data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ institutional_data/ scripts/ requirements.txt
          git diff --cached --quiet || git commit -m "Refresh Aurora futures and institutional data"
          git push
