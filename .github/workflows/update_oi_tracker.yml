name: Aurora Futures OI Tracker

"on":
  workflow_dispatch:
  schedule:
    - cron: "30 13 * * 1-5"

permissions:
  contents: write

jobs:
  update-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Confirm workflow is running
        run: |
          echo "Aurora Futures OI Tracker workflow started."
          echo "Scheduled refresh: 7:00 PM IST, Monday to Friday"
          date -u
