name: Diagnose NSE Institutional Reports

on:
  workflow_dispatch:
    inputs:
      report_date:
        description: "NSE report date to test (YYYY-MM-DD)"
        required: true
        default: "2026-11-09"

permissions:
  contents: read

jobs:
  diagnose-reports:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: homepage-redesign

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test NSE report URLs and file contents
        run: |
          python scripts/diagnose_institutional_reports.py --date "${{ inputs.report_date }}"
